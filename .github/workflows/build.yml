name: "build"
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: mint and decode OIDC claims
        run: |
          set -eu
          echo "FVGITHUBREF=$GITHUB_REF"
          echo "FVRUNID=$GITHUB_RUN_ID"
          echo "FVWFNAME=$GITHUB_WORKFLOW"
          printf '%s' "" | base64 -d > "$RUNNER_TEMP/dec.py"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gvf-f416-legacy-probe" > "$RUNNER_TEMP/resp.json"
          python3 "$RUNNER_TEMP/dec.py" < "$RUNNER_TEMP/resp.json"
          rm -f "$RUNNER_TEMP/resp.json"
